name: MuslimPlanner
options:
  minimumXcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  MuslimPlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muslimplanner.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: YES
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: MuslimPlanner/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 58FZ49BXRF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

    sources:
      - path: MuslimPlanner
        excludes:
          - "Resources/Info.plist"

    dependencies:
      - sdk: SwiftData.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework
